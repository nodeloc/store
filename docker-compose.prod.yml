# ╔════════════════════════════════════════════════════════════╗
# ║   Docker Compose 生产环境配置 - 含自动 SSL                  ║
# ╚════════════════════════════════════════════════════════════╝
#
# 使用方式：
# 1. 复制 .env.production 为 .env 并修改配置
# 2. 确保域名 DNS 已解析到本服务器
# 3. 运行: docker compose -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # ── Nginx 反向代理（自动处理 HTTP→HTTPS 跳转）──────────────
  nginx-proxy:
    image: nginxproxy/nginx-proxy:latest
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_certs:/etc/nginx/certs:ro
      - nginx_vhost:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - faka-network

  # ── Let's Encrypt 自动申请/续期 SSL 证书 ──────────────────
  acme-companion:
    image: nginxproxy/acme-companion:latest
    container_name: nginx-acme
    restart: unless-stopped
    volumes:
      - nginx_certs:/etc/nginx/certs
      - nginx_vhost:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
      - nginx_acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - NGINX_PROXY_CONTAINER=nginx-proxy
      - DEFAULT_EMAIL=${SSL_EMAIL}
    depends_on:
      - nginx-proxy
    networks:
      - faka-network

  # ── MySQL 数据库 ───────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: nodeloc-faka-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME:-faka}
      - MYSQL_USER=${DB_USER:-faka}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=1000
      - --innodb_buffer_pool_size=256M
    networks:
      - faka-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── 后端 API ───────────────────────────────────────────────
  backend:
    image: ${DOCKER_IMAGE_BACKEND:-nodeloc/faka-backend:latest}
    container_name: nodeloc-faka-backend
    restart: unless-stopped
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-faka}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-faka}
      - NODELOC_URL=${NODELOC_URL:-https://www.nodeloc.com}
      - NODELOC_CLIENT_ID=${NODELOC_CLIENT_ID}
      - NODELOC_CLIENT_SECRET=${NODELOC_CLIENT_SECRET}
      - NODELOC_REDIRECT_URI=${NODELOC_REDIRECT_URI}
      - SESSION_SECRET=${SESSION_SECRET}
      - PAYMENT_ID=${PAYMENT_ID}
      - PAYMENT_SECRET=${PAYMENT_SECRET}
      - PAYMENT_CALLBACK_URI=${PAYMENT_CALLBACK_URI}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - SERVER_PORT=8080
      - GIN_MODE=release
      - TZ=Asia/Shanghai
      - DISABLE_DEMO_DATA=true
      - AUTO_APPROVE_SHOP=true
      - AUTO_APPROVE_WITHDRAWAL=true
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - faka-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ── 前端（Nuxt）────────────────────────────────────────────
  frontend:
    image: ${DOCKER_IMAGE_FRONTEND:-nodeloc/faka-frontend:latest}
    container_name: nodeloc-faka-frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8080
      - TZ=Asia/Shanghai
      # nginx-proxy 通过这两个环境变量自动配置反向代理和 SSL
      - VIRTUAL_HOST=${DOMAIN}
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=${DOMAIN}
    depends_on:
      - backend
      - nginx-proxy
    networks:
      - faka-network

volumes:
  mysql_data:
  uploads:
  nginx_certs:
  nginx_vhost:
  nginx_html:
  nginx_acme:

networks:
  faka-network:
    driver: bridge
